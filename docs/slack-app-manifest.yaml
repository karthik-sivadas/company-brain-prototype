# Company Brain — Slack app manifest
# Create the app from this at https://api.slack.com/apps → Create New App → From an app manifest
display_information:
  name: Company Brain
  description: Ask your company's knowledge. Answers come back in-thread, with sources.
  background_color: "#1f2d3d"
features:
  bot_user:
    display_name: Company Brain
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read      # @mentions start a new thread
      - chat:write             # post answers
      - channels:history       # follow-ups in public channels (no @mention needed)
      - channels:read          # resolve channel names
      - groups:history         # follow-ups in private channels
      - groups:read            # list private channels (`slack doctor` membership check)
      - im:history             # DMs
      - im:write               # reply in DMs
      - reactions:write        # hourglass -> check/cross progress
      - files:write            # attach answers that exceed Slack's block limits
      - users:read             # map Slack users to people
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true           # required for the feedback buttons
  socket_mode_enabled: true    # no public URL required
  org_deploy_enabled: false
  token_rotation_enabled: false
